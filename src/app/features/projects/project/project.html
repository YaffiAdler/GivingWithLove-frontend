<div class="page">

  <div class="title">ניהול פרויקטים</div>

  <div class="list-card">
    @if (loadState() === 'loading') {
      <app-loading></app-loading>
    } @else if (loadState() === 'error') {
      <app-error-state message="שגיאה בטעינת הפרויקטים" (retry)="loadProjects()"></app-error-state>
    } @else {
      @for(p of projects(); track p.projectCode) {
        <div class="project-row">
          <span class="code">{{ p.projectCode }}</span>
          <span class="name">{{ p.projectName }}</span>
        </div>
      } @empty {
        <app-empty-state message="אין פרויקטים"></app-empty-state>
      }
    }
  </div>

  <form [formGroup]="frm" class="form-card">

    <div class="form-group">
      <label>שם פרויקט</label>
      <input class="input" formControlName="projectName" type="text">
    </div>

    <div class="form-group">
      <label>מנהל הפרויקט</label>
      <app-person-picker [control]="frm.controls.projectManagerCode" [search]="searchManagers">
      </app-person-picker>
    </div>

    <div class="form-group">
      <label>תחום הפרויקט</label>
      <select class="input" formControlName="domainCode">
        @for(p of projects(); track p.projectCode){
          @if(p.domainCode == null){
            <option [ngValue]="p.projectCode">
              {{p.projectName}}
            </option>
          }
        }
      </select>
    </div>

    <button class="btn" [disabled]="frm.invalid" (click)="addProject()">
      הוסף
    </button>

  </form>

</div>
