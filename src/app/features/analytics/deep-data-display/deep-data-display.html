@if (loadState() === 'loading') {
  <app-loading></app-loading>
} @else if (loadState() === 'error') {
  <app-error-state message="שגיאה בטעינת תתי הפרויקטים" (retry)="retry()"></app-error-state>
} @else if (subProjects().length) {

  <div class="section-title">תתי פרויקטים</div>

  @for(p of subProjects(); track p.subProjectCode) {
    <div class="project">
      <div>{{ p.subProjectName }}</div>
    </div>
  }

} @else {
  <app-empty-state message="אין תתי פרויקטים"></app-empty-state>
}

  </div>

</div>
