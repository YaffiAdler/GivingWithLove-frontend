<div class="date-range-filter">
  <div class="date-range-presets" role="group" aria-label="טווח מהיר">
    @for (item of presets; track item.preset) {
      <button
        type="button"
        class="date-range-preset"
        [class.active]="activePreset() === item.preset"
        [attr.aria-pressed]="activePreset() === item.preset"
        (click)="selectPreset(item.preset)"
      >
        {{ item.label }}
      </button>
    }
  </div>

  <div class="date-range-inputs">
    <label>
      מתאריך
      <input
        #fromInput
        type="date"
        [value]="from()"
        [max]="today"
        [attr.aria-invalid]="errorMessage() !== null"
        (change)="setFrom(fromInput.value)"
      />
    </label>
    <label>
      עד תאריך
      <input
        #toInput
        type="date"
        [value]="to()"
        [max]="today"
        [attr.aria-invalid]="errorMessage() !== null"
        (change)="setTo(toInput.value)"
      />
    </label>
  </div>

  @if (errorMessage(); as message) {
    <div class="date-range-error" role="alert">{{ message }}</div>
  }
</div>
