<div class="domains-container">

  <label class="title">תחום הפרויקט</label>

  <div class="projects-list">
    @if (loadState() === 'loading') {
      <span>טוען נתונים...</span>
    } @else if (loadState() === 'error') {
      <span>שגיאה בטעינת התחומים</span>
    } @else {
      @for(p of departments(); track p.projectCode){
        <a
          class="project-link"
          [routerLink]="['sub', p.projectCode , p.projectName]">
          {{p.projectName}}
        </a>
      } @empty {
        <span>אין תחומים</span>
      }
    }
  </div>

  <a
    class="add-btn"
    routerLink="project"
    routerLinkActive="active-link">
    להוספת תחום
  </a>

  <router-outlet></router-outlet>
</div>
