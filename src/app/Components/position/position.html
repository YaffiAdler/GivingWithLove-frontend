<div class="page">

  <div class="title">ניהול תפקידים</div>

  <div class="table-wrapper">
    <table class="positions-table">
      <thead>
        <tr>
          <th>תפקיד מספר</th>
          <th>שם תפקיד</th>
        </tr>
      </thead>

      <tbody>
        @if (loadState() === 'loading') {
          <tr><td colspan="2">טוען נתונים...</td></tr>
        } @else if (loadState() === 'error') {
          <tr><td colspan="2">שגיאה בטעינת התפקידים</td></tr>
        } @else {
          @for (p of positions(); track p.positionCode) {
            <tr>
              <td>{{ p.positionCode }}</td>
              <td>{{ p.positionName }}</td>
            </tr>
          } @empty {
            <tr><td colspan="2">אין תפקידים</td></tr>
          }
        }
      </tbody>
    </table>
  </div>

  <form [formGroup]="frmPosition" class="position-form">

    <div class="form-card">

      <div class="form-group">
        <label class="label-form">הכנס את שם התפקיד</label>
        <input type="text" class="input" formControlName="positionName" />
      </div>

      <button class="save-btn"
              [disabled]="frmPosition.invalid"
              (click)="save()">
        שמירה
      </button>

    </div>

  </form>

</div>
