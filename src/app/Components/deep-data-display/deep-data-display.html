@if(subProjects().length) {

  <div class="section-title">תתי פרויקטים</div>

  @for(p of subProjects(); track p.subProjectCode) {
    <div class="project">
      <div>{{ p.subProjectName }}</div>
    </div>
  }

}
@else {
  <div class="empty-state">אין תתי פרויקטים</div>
}
