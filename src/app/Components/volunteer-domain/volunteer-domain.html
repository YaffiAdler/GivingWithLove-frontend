<form [formGroup]="vlntrDmnFrm" dir="rtl">
<div class="volunteer-domains-section">
  <label for="domain"> תחום ההתנדבות:</label>
  <select class="form-control" formControlName="domain"  name="domain" id="1"  >
    @for (p of projects(); track p.projectCode) {
      <option [ngValue]="p.projectCode">
      {{p.projectName}}</option>
    }
  </select>
</div>
</form>
  <button type="button" (click)="addDomain()" >➕ להוספת תחום</button>
